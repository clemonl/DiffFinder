[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "difffinder"
version = "0.1.0"
description = "Check a Python function against a reference solution and see exactly how they differ."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Clement Leung" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
hermes = ["hermes-acp-sdk"]

[project.urls]
Homepage = "https://github.com/clemonl/DiffFinder"

[tool.hatch.build.targets.wheel]
packages = ["src/difffinder"]
