[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tracecomparekit"
version = "0.2.0"
description = "Check a Python function against a reference solution and see exactly how they differ."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Clement Leung" },
    { name = "Iko Yeung" },
    { name = "James" }
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
hermes = [
    "hermes-acp-sdk",
    "hermes-agent[acp]"
]

[project.urls]
Homepage = "https://github.com/clemonl/DiffFinder"
Repository = "https://github.com/clemonl/DiffFinder"
Documentation = "https://github.com/clemonl/DiffFinder#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/difffinder"]
